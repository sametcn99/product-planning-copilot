<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title | default: site.title }}</title>
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="{{ page.robots | default: site.robots }}" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}" />
    {% seo %}
  </head>
  <body data-bs-theme="dark">
    <div class="site-shell">
      <header class="border-bottom border-secondary-subtle hero-header">
        <div class="container py-5">
          <div class="row align-items-center g-4">
            <div class="col-lg-8">
              <h1 class="display-4 fw-semibold mb-3">{{ page.title | default: site.title }}</h1>
              <p class="lead text-secondary mb-0">
                {{ page.description | default: site.description }}
              </p>
            </div>
            <div class="col-lg-4">
              <div class="hero-panel p-4 rounded-4">
                <p class="small text-uppercase text-secondary mb-2">Repository</p>
                <p class="mb-3 fw-semibold">{{ site.repository }}</p>
              </div>
            </div>
          </div>
        </div>
      </header>

      <main class="container py-5">
        <div class="content-panel rounded-4 p-4 p-lg-5">{{ content }}</div>
      </main>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
